<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>Cuarto Michi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Un cuartito en pixel art: contadores y secretos arriba, escenario, diálogo tipo videojuego, botón grande. Un solo mundo, a propósito */
:root{
  --bg:#1f1a2b; --panel:#2c2540; --edge:#f6e7d2; --ink:#f6e7d2; --soft:#b9a9cf;
  --btn:#ff7a8a; --btn-d:#c4505f; --slot:#3a3152; --gold:#ffd34d;
  --px:"Pixelify Sans",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--px);font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#titulo{font-size:26px;font-weight:700;letter-spacing:.02em;cursor:pointer;line-height:1}
#titulo span{color:var(--btn)}
#mute{font:inherit;font-size:14px;background:var(--panel);color:var(--soft);border:2px solid var(--slot);padding:6px 10px;cursor:pointer}
.hud{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.chip{background:var(--panel);border:2px solid var(--slot);padding:4px 8px;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--btn)}
#slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
#slots button{aspect-ratio:1;background:var(--slot);display:grid;place-items:center;font:inherit;font-size:12px;color:var(--soft);border:0;padding:0;cursor:pointer}
#slots button.on{background:var(--gold);color:var(--bg)}
#slots button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{position:relative;border:4px solid var(--edge);box-shadow:0 0 0 4px var(--panel),0 12px 30px rgba(0,0,0,.4);line-height:0}
canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:manipulation;cursor:pointer}
#tags{position:absolute;inset:0;pointer-events:none;line-height:1.2}
.nm{position:absolute;transform:translate(-50%,-100%);background:var(--edge);color:#2a1520;font-size:13px;font-weight:600;padding:2px 7px;white-space:nowrap}
.nm::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--edge)}
.dialog{background:var(--panel);border:3px solid var(--edge);padding:12px 14px;min-height:76px;font-size:17px;line-height:1.35;position:relative}
.dialog::after{content:"▼";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--soft);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#btn{font:inherit;font-weight:700;font-size:24px;color:#2a1520;background:var(--btn);border:0;padding:16px;cursor:pointer;box-shadow:inset -4px -6px 0 var(--btn-d),0 6px 0 #6d2a36;position:relative;top:0;touch-action:manipulation}
#btn:active{top:4px;box-shadow:inset -4px -6px 0 var(--btn-d),0 2px 0 #6d2a36}
#btn:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hint{font-size:13px;color:var(--soft);text-align:center;margin-top:-2px;line-height:1.35}
@media (prefers-reduced-motion:reduce){.dialog::after{animation:none}}
</style>
</head><body>

<div class="app">
  <div class="top">
    <div id="titulo">cuarto <span>michi</span></div>
    <button id="mute" type="button" aria-pressed="false">♪ sí</button>
  </div>
  <div class="hud">
    <div class="chip" id="mcnt">michis <b>0</b>/6</div>
    <div class="chip" id="cnt">secretos <b>0</b>/10</div>
  </div>
  <div id="slots" aria-label="Secretos"></div>
  <div class="stage"><canvas id="c" width="128" height="144" aria-label="Cuarto con gatitos en pixel art"></canvas><div id="tags"></div></div>
  <div class="dialog" id="dlg" aria-live="polite"></div>
  <button id="btn" type="button">siguiente</button>
  <div class="hint">toca a los michis para acariciarlos · los cuadritos de arriba dan pistas, y los que ya tienen ★ se repiten</div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=128,H=144,FLOOR=100;
const R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
const hour=new Date().getHours(),NIGHT=hour>=20||hour<6;
const clampX=x=>Math.max(0,Math.min(W-20,x));
/* ---------- sprites (relleno; el contorno se calcula solo) ---------- */
const SIT=[
"..f.........f.....",
"..ff.......ff.....",
"..fpf.....fpf.....",
".fffffffffffff....",
".fffffffffffff....",
".ffekfffffekff....",
".ffeefffffeeff....",
".bfffffpfffffb....",
"..fffffffffff.....",
"...fffffffff......",
"..ffbbbbbbbff.....",
".fffbbbbbbbfff....",
".fffbbbbbbbfff....",
".fffbbbbbbbfff....",
".ffffbbbbbffff....",
".ffbb.....bbff...."];
const TAIL=[[[14,13],[15,13],[15,12],[16,12],[16,11],[16,10],[16,9],[15,8]],
            [[14,13],[15,13],[16,13],[16,12],[17,11],[17,10],[17,9],[16,8]]];
const ACC={
 cofia:{w:[[5,-3],[6,-3],[8,-3],[9,-3],[4,-2],[5,-2],[9,-2],[10,-2],[4,-1],[5,-1],[6,-1],[8,-1],[9,-1],[10,-1]],r:[[7,-3],[6,-2],[7,-2],[8,-2],[7,-1]]},
 cubre:{m:[[4,7],[5,7],[6,7],[7,7],[8,7],[9,7],[10,7],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8],[10,8],[3,6],[11,6]]},
 corona:{g:[[5,-3],[7,-4],[9,-3],[5,-2],[6,-2],[7,-2],[8,-2],[9,-2],[5,-1],[6,-1],[7,-1],[8,-1],[9,-1]],r:[[7,-2]]}
};
const PALS={
 naranja:{f:'#e8893a',b:'#f8d6a8',p:'#f29aa6',e:'#2a1d14',k:'#fff',o:'#3a2418'},
 gris:{f:'#8f97a3',b:'#dde1e7',p:'#f2a0ac',e:'#22262c',k:'#fff',o:'#2b2f36'},
 negro:{f:'#34313d',b:'#4b4757',p:'#e88b99',e:'#f2d14b',k:'#fff',o:'#141218'},
 blanco:{f:'#f4f1ea',b:'#ffffff',p:'#f6a9b5',e:'#4a7fd0',k:'#fff',o:'#6b6660'},
 smoking:{f:'#2f2c37',b:'#f4f1ea',p:'#f29aa6',e:'#9be26b',k:'#fff',o:'#131117'},
 crema:{f:'#e3cfae',b:'#f7efe0',p:'#f2a0ac',e:'#3c6fb8',k:'#fff',o:'#5a4632'},
 dorado:{f:'#f2c14e',b:'#fff0b3',p:'#f6a0a8',e:'#5a3a08',k:'#fff',o:'#7a5410'}
};
const AC={w:'#ffffff',r:'#e0474c',m:'#9fd6ea',g:'#ffd34d'};
const cache={};
function sprite(pal,tail,sleep,acc){
 const key=pal+tail+sleep+acc;if(cache[key])return cache[key];
 const GW=20,GH=22,OX=1,OY=5;const g=Array.from({length:GH},()=>Array(GW).fill(''));
 SIT.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')g[y+OY][x+OX]=ch}));
 TAIL[tail].forEach(([x,y])=>g[y+OY][x+OX]='f');
 if(sleep){for(const x of[3,4,10,11]){g[5+OY][x+OX]='f';g[6+OY][x+OX]='e'}}
 if(acc&&ACC[acc])for(const c in ACC[acc])ACC[acc][c].forEach(([x,y])=>g[y+OY][x+OX]='A'+c);
 const P=PALS[pal],oc=document.createElement('canvas');oc.width=GW;oc.height=GH;const o=oc.getContext('2d');
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
   let ch=g[y][x];
   if(!ch){const n=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>g[y+dy]&&g[y+dy][x+dx]);if(!n)continue;o.fillStyle=P.o}
   else o.fillStyle=ch[0]==='A'?AC[ch[1]]:P[ch];
   o.fillRect(x,y,1,1)}
 return cache[key]=oc;
}
const PAT={
 heart:["xx.xx","xxxxx",".xxx.","..x.."],
 z:["xxx","..x",".x.","xxx"],
 fish:["..x...x","xxxx.xx","xxxxxxx","xxxx.xx","..x...x"],
 star:[".x.","xxx",".x."]
};
function pat(p,x,y,col){ctx.fillStyle=col;PAT[p].forEach((r,j)=>[...r].forEach((c,i)=>{if(c==='x')ctx.fillRect(Math.round(x)+i,Math.round(y)+j,1,1)}))}

/* ---------- mundo ---------- */
const NOMBRES=[
 ['Paracetamol','naranja','Viene a quitarte el dolor de cabeza de la guardia.'],
 ['Suero','gris','Gotea cariño a 20 gotas por minuto.'],
 ['Curita','blanco','No cura nada, pero es bonita.'],
 ['Kardex','smoking','Lleva el registro de todas tus siestas.'],
 ['Veno','negro','De cariño, porque se llama Venoclisis. Nunca falla al primer intento.'],
 ['Algodón','crema','Se esponja cuando está feliz.']];
let cats=[],parts=[],birds=[],usados=new Set();
let cup={on:true,x:107,y:39,vy:0,vx:0,fall:false};
let fish=null,bowl=null,yarn=null,puddle=null,prints=[],cloud=null,boxOn=false,lightsOff=false,zoomUntil=0;
let T=0,taps=0,tapTimes=[];
const SECRETS=['firma','dorado','enfermera','zoomies','cafe','dormir','ronroneo','cielo','caja','fiesta'];
let found=new Set();
try{const s=JSON.parse(localStorage.getItem('cuarto-michi')||'{}');(s.found||[]).forEach(f=>found.add(f))}catch(e){}
function save(){try{localStorage.setItem('cuarto-michi',JSON.stringify({found:[...found]}))}catch(e){}}

/* ---------- sonido 8 bits ---------- */
let ac=null,muted=false;
function tone(f1,f2,dur,type='square',vol=.05){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur*.6);o.frequency.exponentialRampToValueAtTime(f1*.8,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}catch(e){}}
const miau=()=>tone(620+R()*200,1150,.35);
const prr=()=>{for(let i=0;i<6;i++)setTimeout(()=>tone(70,60,.12,'triangle',.12),i*110)};
const hiss=()=>tone(300,120,.35,'sawtooth',.035);
const ding=()=>{tone(880,1320,.15,'square',.04);setTimeout(()=>tone(1320,1760,.2,'square',.04),120)};
const muteBtn=document.getElementById('mute');
muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?'♪ no':'♪ sí';muteBtn.setAttribute('aria-pressed',muted)};

/* ---------- diálogo ---------- */
const dlg=document.getElementById('dlg');let typeT=null;
function say(txt){clearInterval(typeT);let i=0;dlg.textContent='';typeT=setInterval(()=>{dlg.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(typeT)},20)}

/* ---------- michis ---------- */
function rowY(){const a=cats.filter(c=>c.y<123).length,b=cats.length-a;return a<b?114:132}
function freeX(y){const mates=cats.filter(c=>Math.abs(c.y-y)<10);let best=50,bd=-1;for(let i=0;i<24;i++){const x=2+R()*(W-24);const d=mates.length?Math.min(...mates.map(c=>Math.abs(c.tx-x))):99;if(d>bd){bd=d;best=x}}return best}
function spawn(kind){
 let nombre,pal,txt='',acc='';
 if(kind==='dorado'){nombre='Michi dorado';pal='dorado';acc='corona'}
 else if(kind==='jefa'){nombre='Jefa de piso';pal='blanco';acc='cofia'}
 else{const n=NOMBRES.find(n=>!usados.has(n[0]));if(!n)return null;usados.add(n[0]);[nombre,pal,txt]=n}
 const c={name:nombre,pal,acc,txt,kind:kind||'',x:R()<.5?-18:W,y:rowY(),dir:1,tx:0,state:'walk',t:R()*9,jump:0,jh:0,sleep:false,mad:0,pets:0};
 c.tx=freeX(c.y);c.dir=c.x<0?1:-1;cats.push(c);cats.sort((a,b)=>a.y-b.y);tag(c,4000);paintHud();miau();return c;
}
function tag(c,ms=3200){if(c)c.tagUntil=performance.now()+ms}
const cx=c=>c.x+10;
function hop(c,h=10){if(c.jump<=0){c.jump=.55;c.jh=h}}
function heart(x,y){parts.push({k:'heart',x:x-2,y,vy:-10,life:1.4,col:'#ff6f91'})}
function hearts(c){heart(cx(c),c.y-22);setTimeout(()=>heart(cx(c)+3,c.y-24),250)}
function goTo(c,x,fn){c.sleep=false;c.tx=clampX(x);c.state='walk';c.onArrive=fn||null}
const isFree=c=>!c.sleep&&!c.inBox&&!c.eat&&!c.tangled&&!c.onArrive&&!c.hidden&&!(c.mad>T)&&!c.waiting;
const free=()=>cats.filter(isFree);
function nearest(x,list,except){return list.filter(k=>k!==except).sort((a,b)=>Math.abs(cx(a)-x)-Math.abs(cx(b)-x))[0]}
function makeMad(c,by){c.sleep=false;c.mad=T+25;c.madBy=by||null;c.pets=0;hiss();hop(c,8);parts.push({k:'bang',x:cx(c)-1,y:c.y-28,vy:-4,life:1.2,col:'#ff5a5a'})}

/* ---------- eventos con consecuencia ---------- */
const MIAUS=['miau (traducción: ¿ya comiste?)','miau (traducción: toma agua)','miau (traducción: estás haciendo un buen trabajo)','miau (traducción: Uzziel me obligó a decir esto)','miau (traducción: cinco minutitos más)'];
let deck=[],lastA='',mdeck=[];
function nextMiau(){if(!mdeck.length)mdeck=MIAUS.slice().sort(()=>R()-.5);return mdeck.shift()}
function nextStarter(){
 const ok=a=>({cup:cup.on&&!cup.fall&&!puddle,food:!bowl,yarn:!yarn,gift:!fish})[a]!==false;
 for(let i=0;i<10;i++){if(!deck.length){deck=['miau','yarn','food','gift','nap','cup','boop'].sort(()=>R()-.5);if(deck[0]===lastA)deck.push(deck.shift())}
   const a=deck.shift();if(ok(a))return lastA=a}
 return 'miau';
}
function followups(){
 const f=[],fr=free();
 if(bowl&&bowl.waiting)return['refill'];
 if(fish&&!fish.busy&&fr.length)f.push('fish');
 if(cats.some(c=>c.sleep)&&fr.length&&!lightsOff)f.push('wake');
 if(yarn&&yarn.still&&fr.length)f.push('tangle');
 if(cats.some(c=>c.tangled)&&fr.length)f.push('untangle');
 if(puddle&&!puddle.stepped&&fr.length)f.push('paws');
 if(puddle&&puddle.stepped)f.push('clean');
 if(bowl&&bowl.empty&&!bowl.waiting&&fr.length)f.push('more');
 if(cats.some(c=>c.mad>T&&c.madBy&&isFreeIgnoringMad(c.madBy)))f.push('sorry');
 return f;
}
const isFreeIgnoringMad=c=>cats.includes(c)&&!c.sleep&&!c.inBox&&!c.eat&&!c.tangled&&!c.onArrive&&!c.hidden;

const EV={
 miau(){const c=pick(free());if(!c)return EV.idle();tag(c);hop(c,12);miau();hearts(c);say(c.name+' dice: '+nextMiau())},
 idle(){say('Todos están ocupados. Dales un segundito.')},
 yarn(){const from=R()<.5?2:W-8;yarn={x:from,y:126,vx:from<10?45:-45,still:false};
   const fr=free().sort((a,b)=>Math.abs(cx(a)-from)-Math.abs(cx(b)-from)).slice(0,2);
   fr.forEach((k,i)=>{k.chase=true;k.off=i?14:-14;tag(k)});cats.forEach(k=>{if(!k.chase&&!k.sleep)k.dir=Math.sign(from-cx(k))||1});
   say('Salió un estambre rodando. '+fr.map(k=>k.name).join(' y ')+(fr.length>1?' van':' va')+' tras él.')},
 tangle(){const c=nearest(yarn.x,free());tag(c,4000);goTo(c,yarn.x-8,c=>{if(!yarn)return;c.tangled=true;yarn=null;tag(c);say(c.name+' se puso a jugar con el estambre que quedó tirado… y se enredó.')});
   say(c.name+' vio el estambre que quedó tirado en el piso.')},
 untangle(){const t=cats.find(c=>c.tangled),h=nearest(cx(t),free());tag(h,4000);say(h.name+' fue a ayudar a '+t.name+' a desenredarse.');
   goTo(h,t.x+(t.x>W/2?-14:14),h=>{t.tangled=false;h.dir=Math.sign(t.x-h.x)||1;hearts(t);hearts(h);miau();tag(t);say('Listo: '+t.name+' quedó libre y se lo agradeció a '+h.name+' con un cabezazo.')})},
 food(){bowl={x:58,y:128,empty:false};const fr=free().sort((a,b)=>Math.abs(cx(a)-64)-Math.abs(cx(b)-64)).slice(0,2);
   fr.forEach((k,i)=>{tag(k,4000);goTo(k,i?bowl.x+8:bowl.x-19,k=>{k.dir=i?-1:1;k.eat=true})});
   setTimeout(()=>{if(bowl){bowl.empty=true;cats.forEach(k=>k.eat=false)}},7000);
   say('Hora de comer: serví un plato. '+fr.map(k=>k.name).join(' y ')+(fr.length>1?' llegaron':' llegó')+' primero.')},
 more(){const c=nearest(63,free());bowl.waiting=c;c.waiting=true;tag(c,6000);goTo(c,bowl.x-19,c=>{c.dir=1;miau()});
   say(c.name+' llegó tarde y encontró el plato vacío. Se sentó a esperar. Toca para servirle.')},
 refill(){const c=bowl.waiting;bowl.waiting=null;bowl.empty=false;c.waiting=false;c.eat=true;tag(c);hearts(c);miau();
   setTimeout(()=>{c.eat=false;bowl=null},5000);say('Le serviste a '+c.name+'. Ya está feliz.')},
 gift(){const c=pick(free());if(!c)return EV.idle();tag(c);miau();fish={x:clampX(cx(c)+(c.dir>0?6:-14)),y:c.y-4,owner:c,busy:false};
   say(c.name+' trajo un pescado y lo dejó en el piso. Es lo más valioso que tiene.')},
 fish(){fish.busy=true;const a=cats.includes(fish.owner)&&isFreeIgnoringMad(fish.owner)?fish.owner:null;const b=nearest(fish.x,free(),a);if(!b){fish.busy=false;return EV.miau()}
   const own=a||nearest(fish.x,free(),b);
   tag(b,5000);if(own)tag(own,5000);let llegaron=0;const need=own?2:1;
   const resolve=()=>{if(++llegaron<need)return;
     if(!own||R()<.5){[b,own].filter(Boolean).forEach(k=>{k.eat=true;hearts(k)});miau();
       setTimeout(()=>{fish=null;[b,own].filter(Boolean).forEach(k=>k.eat=false)},3500);
       say(own?b.name+' y '+own.name+' compartieron el pescado. Mitad y mitad.':b.name+' se comió el pescado. Nadie lo reclamó.')}
     else{b.hidden=own.hidden=true;cloud={x:fish.x+3,y:fish.y-6,until:T+1.8};hiss();setTimeout(hiss,500);setTimeout(hiss,1000);say('¡Pelea por el pescado!');
       setTimeout(()=>{b.hidden=own.hidden=false;cloud=null;fish=null;const[wn,ls]=R()<.5?[b,own]:[own,b];
         tag(wn);tag(ls);hearts(wn);makeMad(ls,wn);goTo(ls,ls.x+(ls.x>W/2?-40:40));
         say('Ganó '+wn.name+'. '+ls.name+' se ofendió y se fue a la otra esquina.')},1800)}};
   goTo(b,fish.x+8,resolve);if(own)goTo(own,fish.x-20,resolve);
   say(b.name+' vio el pescado de '+(own?own.name:'nadie')+'… ¿lo van a compartir?')},
 wake(){const s=cats.find(c=>c.sleep),a=nearest(cx(s),free());tag(a,4000);
   goTo(a,s.x+(s.x>W/2?-14:14),a=>{a.dir=Math.sign(s.x-a.x)||1;tag(s);
     if(R()<.6){makeMad(s,a);tag(a);goTo(s,s.x+(s.x>W/2?-36:36));say(s.name+' se despertó de malas, se cambió de lugar y ya no le habla a '+a.name+'.')}
     else{a.sleep=true;hearts(a);say('Al final '+a.name+' se acostó junto a '+s.name+'. Ahora son dos dormidos.')}});
   say(a.name+' fue a molestar a '+s.name+' mientras dormía…')},
 sorry(){const m=cats.find(c=>c.mad>T&&c.madBy&&isFreeIgnoringMad(c.madBy)),c=m.madBy;c.chase=false;tag(c,4000);
   say(c.name+' se siente culpable y fue a buscar a '+m.name+'.');
   goTo(c,m.x+(m.x>W/2?-14:14),c=>{c.dir=Math.sign(m.x-c.x)||1;m.mad=0;m.madBy=null;hearts(m);hearts(c);prr();tag(m);say(c.name+' le pidió perdón a '+m.name+' con un cabezazo. Ya están bien.')})},
 nap(){const c=pick(free());if(!c)return EV.idle();tag(c,4000);goTo(c,26+R()*58,c=>{c.sleep=true});say(c.name+' se cansó y se fue a dormir al tapete.')},
 cup(){const c=pick(free());if(!c)return EV.idle();tag(c,5000);say(c.name+' se quedó viendo tu café de la repisa… con mucho interés.');
   goTo(c,96,c=>{c.culprit=true;hop(c,62);setTimeout(()=>{if(cup.on&&!cup.fall){cup.fall=true;cup.vy=-20;cup.vx=12}},260)})},
 paws(){const c=nearest(puddle.x,free());tag(c,5000);puddle.stepped=true;
